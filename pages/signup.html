<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Globit | Sign Up</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../globit_logo.png">
    <!-- Styles -->
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/signup.css">
    <!-- Fonts and Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jacquard+24&family=Noto+Sans+Display:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  </head>
  <body>
    <header class="header">
      <img class="globit_logo" src="../assets/globit_logo.png">
    </header>
    <form id="signUpForm">
      <h2>Sign Up to Globit</h2>
      <div class="input-group">
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" required>
      </div>
      <div class="input-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
      </div>
      <div class="input-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" required>
      </div>
      <button class="submit" type="submit">Submit</button>
      <h5>Already a user? <a class="logIn" href="../index.html">Login</a></h5>
  </form>
    <script src="../scripts/pages/signup.js" type="module"></script>
  </body>
</html>
